# The same gates as the pre-push hook (scripts/gates.ts), on every push and pull request.
# Read-only token, no credentials left on disk for the install and the gates, and actions pinned to commits
# (.github/dependabot.yml proposes updates).
name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # rsvg-convert, which preview_svg uses to render drawings (and its test checks).
      - run: sudo apt-get install -y --no-install-recommends librsvg2-bin
      - run: pnpm install --frozen-lockfile
      # The browser test must run, never skip: GitHub's runner has Google Chrome, and ORGANON_REQUIRE_CHROMIUM makes a
      # missing browser a failure (the core's findChromium), as in Organon's canary.
      - run: pnpm gates
        env:
          ARISTOTLE_TEST_CHROMIUM: /usr/bin/google-chrome
          ORGANON_REQUIRE_CHROMIUM: '1'
