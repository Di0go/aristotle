# The same gates as the pre-push hook (scripts/gates.ts), on every push and pull request.
# Read-only token, no credentials left on disk for the install and the gates, and actions pinned to commits
# (.github/dependabot.yml proposes updates).
name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # rsvg-convert, which preview_svg uses to render drawings (and its test checks).
      - run: sudo apt-get install -y --no-install-recommends librsvg2-bin
      - run: pnpm install --frozen-lockfile
      - run: pnpm gates
