<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Aristotle: a tutor that makes you think">
  <defs>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#1b1b1b"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#333333"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="18" fill="url(#glow)"/>
  <rect x="640" width="640" height="420" fill="url(#dots)" opacity="0.7"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="17.5" fill="none" stroke="#333333"/>

  <!-- The ensō: the app's mark, drawn once. -->
  <g transform="translate(150 102) scale(6.75)">
    <path d="M22.6 9.2 A9 9 0 1 0 25 16.2" fill="none" stroke="#f2636a" stroke-width="3.1" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.6s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/>
    </path>
    <circle cx="16" cy="16" r="2.6" fill="#e6e6e6">
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.7;1" dur="1.6s" fill="freeze"/>
    </circle>
  </g>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="420" y="178" font-size="88" font-weight="700" letter-spacing="-3" fill="#e6e6e6">Aristotle</text>
    <text x="424" y="230" font-size="27" font-weight="500" fill="#9a9a9a">A tutor that makes you think, then makes you do.</text>
    <line x1="424" y1="272" x2="484" y2="272" stroke="#f2636a" stroke-width="2.5" stroke-linecap="round"/>
    <text x="424" y="314" font-size="20" font-style="italic" fill="#9a9a9a">“For the things we have to learn before we can do them,</text>
    <text x="424" y="342" font-size="20" font-style="italic" fill="#9a9a9a">we learn by doing them.”</text>
    <text x="424" y="374" font-size="15" letter-spacing="0.4" fill="#5c5c5c">Aristotle, Nicomachean Ethics II.1 (tr. W. D. Ross)</text>
  </g>
</svg>
