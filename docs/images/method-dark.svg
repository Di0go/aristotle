<!-- The method, as the README draws it: learn, map, review and train, praxis, and what fails in practice going back to the map. Dark variant; method-light.svg is the same drawing in light colours. -->
<svg xmlns="http://www.w3.org/2000/svg" width="876" height="324" viewBox="0 0 876 324" role="img" aria-labelledby="title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">The method: Learn feeds the Map; the Map sends you to Review and Train; both lead to Praxis; what fails in practice goes back to the Map as shaky.</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0.8 L10,5 L0,9.2 z" fill="#7d7d7d"/>
    </marker>
    <marker id="head-acc" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0.8 L10,5 L0,9.2 z" fill="#6ea8ff"/>
    </marker>
  </defs>
  <rect x="8" y="94" width="150" height="88" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.25"/>
  <text x="83" y="126" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e6e6e6">Learn</text>
  <text x="83" y="149" text-anchor="middle" font-size="13.5" fill="#a3a3a3">one reasoning step,</text>
  <text x="83" y="167" text-anchor="middle" font-size="13.5" fill="#a3a3a3">then a check</text>
  <rect x="212" y="94" width="196" height="88" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.25"/>
  <text x="310" y="126" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e6e6e6">Map</text>
  <text x="310" y="149" text-anchor="middle" font-size="13.5" fill="#a3a3a3">what holds, what’s shaky,</text>
  <text x="310" y="167" text-anchor="middle" font-size="13.5" fill="#a3a3a3">what rests on what</text>
  <rect x="478" y="22" width="172" height="88" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.25"/>
  <text x="564" y="54" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e6e6e6">Review</text>
  <text x="564" y="77" text-anchor="middle" font-size="13.5" fill="#a3a3a3">recall it just</text>
  <text x="564" y="95" text-anchor="middle" font-size="13.5" fill="#a3a3a3">as it starts to fade</text>
  <rect x="478" y="166" width="172" height="88" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.25"/>
  <text x="564" y="198" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e6e6e6">Train</text>
  <text x="564" y="221" text-anchor="middle" font-size="13.5" fill="#a3a3a3">problems just past</text>
  <text x="564" y="239" text-anchor="middle" font-size="13.5" fill="#a3a3a3">what you can do</text>
  <rect x="718" y="94" width="150" height="88" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.25"/>
  <text x="793" y="126" text-anchor="middle" font-size="16.5" font-weight="600" fill="#e6e6e6">Praxis</text>
  <text x="793" y="149" text-anchor="middle" font-size="13.5" fill="#a3a3a3">use it for real,</text>
  <text x="793" y="167" text-anchor="middle" font-size="13.5" fill="#a3a3a3">in your own life</text>
  <path d="M158,138 H211" fill="none" stroke="#7d7d7d" stroke-width="1.5" marker-end="url(#head)"/>
  <path d="M408,126 C442.5,126 442.5,66 477,66" fill="none" stroke="#7d7d7d" stroke-width="1.5" marker-end="url(#head)"/>
  <path d="M408,150 C442.5,150 442.5,210 477,210" fill="none" stroke="#7d7d7d" stroke-width="1.5" marker-end="url(#head)"/>
  <path d="M650,66 C683.5,66 683.5,126 717,126" fill="none" stroke="#7d7d7d" stroke-width="1.5" marker-end="url(#head)"/>
  <path d="M650,210 C683.5,210 683.5,150 717,150" fill="none" stroke="#7d7d7d" stroke-width="1.5" marker-end="url(#head)"/>
  <path d="M793,182 V264 Q793,282 775,282 H328 Q310,282 310,264 V183" fill="none" stroke="#6ea8ff" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="0.5 6" marker-end="url(#head-acc)"/>
  <text x="551.5" y="306" text-anchor="middle" font-size="13.5" font-style="italic" fill="#6ea8ff">what fails in practice goes back to shaky</text>
</svg>
