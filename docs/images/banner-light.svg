<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Aristotle: a tutor that makes you think">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#f1f1ef"/>
      <stop offset="1" stop-color="#fbfbfa"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e2e2e2"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="18" fill="url(#glow)"/>
  <rect width="1280" height="420" rx="18" fill="url(#dots)" opacity="0.45"/>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="17.5" fill="none" stroke="#e2e2e2"/>

  <!-- The mark: the peripatos, a walk that turns inward to a point. Drawn once. -->
  <g transform="translate(193 82) scale(5.3)">
    <path d="M8 38 C8 22 18 10 30 12 C40 14 41 30 30 32 C22 33.5 21 22 28 22" fill="none" stroke="#1f1f1f" stroke-width="3.2" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="100" to="0" dur="1.8s" calcMode="spline" keyTimes="0;1" keySplines="0.35 0 0.25 1" fill="freeze"/>
    </path>
    <circle cx="8" cy="38" r="3" fill="#1f1f1f"/>
    <circle cx="29" cy="22" r="4.4" fill="#2f6fde">
      <animate attributeName="r" values="0;0;5.2;4.4" keyTimes="0;0.8;0.92;1" dur="2.1s" fill="freeze"/>
    </circle>
  </g>

  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="475" y="178" font-size="88" font-weight="700" letter-spacing="-3" fill="#1f1f1f">Aristotle</text>
    <text x="479" y="230" font-size="27" font-weight="500" fill="#5e5e5e">A tutor that makes you think, then makes you do.</text>
    <line x1="479" y1="272" x2="539" y2="272" stroke="#2f6fde" stroke-width="2.5" stroke-linecap="round"/>
    <text x="479" y="314" font-size="20" font-style="italic" fill="#5e5e5e">“For the things we have to learn before we can do them,</text>
    <text x="479" y="342" font-size="20" font-style="italic" fill="#5e5e5e">we learn by doing them.”</text>
    <text x="479" y="374" font-size="15" letter-spacing="0.4" fill="#a3a3a3">Aristotle, Nicomachean Ethics II.1 (tr. W. D. Ross)</text>
  </g>
</svg>
