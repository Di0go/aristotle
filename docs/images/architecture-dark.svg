<!-- How Aristotle is wired, as the README draws it: Claude Code, the bridge, the Node server, the browser and data/. Dark variant; architecture-light.svg is the same drawing in light colours. -->
<svg xmlns="http://www.w3.org/2000/svg" width="874" height="240" viewBox="0 0 874 240" role="img" aria-labelledby="title" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How it works: Claude Code talks to server/bridge.ts over stdio, the bridge to the Node server over MCP over HTTP; the server sends the browser live events (SSE) and a pseudo-terminal over WebSocket, and reads and writes data/, plain files.</title>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0.8 L10,5 L0,9.2 z" fill="#7d7d7d"/>
    </marker>
    <marker id="tail" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M10,0.8 L0,5 L10,9.2 z" fill="#7d7d7d"/>
    </marker>
  </defs>
  <rect x="8" y="28" width="128" height="66" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.25"/>
  <text x="72" y="56" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e6e6">Claude Code</text>
  <text x="72" y="77" text-anchor="middle" font-size="13.5" font-style="italic" fill="#a3a3a3">the tutor</text>
  <rect x="192" y="28" width="164" height="66" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.25"/>
  <text x="274" y="66" text-anchor="middle" font-size="14" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#e6e6e6">server/bridge.ts</text>
  <rect x="476" y="28" width="144" height="66" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.25"/>
  <text x="548" y="56" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e6e6">Node server</text>
  <text x="548" y="77" text-anchor="middle" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#a3a3a3">127.0.0.1:4747</text>
  <rect x="752" y="28" width="114" height="66" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.25"/>
  <text x="809" y="56" text-anchor="middle" font-size="16" font-weight="600" fill="#e6e6e6">Browser</text>
  <text x="809" y="77" text-anchor="middle" font-size="13.5" font-style="italic" fill="#a3a3a3">Svelte 5</text>
  <path d="M136,61 H191" fill="none" stroke="#7d7d7d" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="164" y="52" text-anchor="middle" font-size="13" fill="#a3a3a3">stdio</text>
  <path d="M356,61 H475" fill="none" stroke="#7d7d7d" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="416" y="52" text-anchor="middle" font-size="13" fill="#a3a3a3">MCP over HTTP</text>
  <path d="M621,47 H751" fill="none" stroke="#7d7d7d" stroke-width="1.5" marker-start="url(#tail)" marker-end="url(#head)"/>
  <text x="686" y="38" text-anchor="middle" font-size="13" fill="#a3a3a3">live events (SSE)</text>
  <path d="M620,75 H751" fill="none" stroke="#7d7d7d" stroke-width="1.5" marker-end="url(#head)"/>
  <text x="686" y="95" text-anchor="middle" font-size="13" fill="#a3a3a3">pseudo-terminal</text>
  <text x="686" y="112" text-anchor="middle" font-size="13" fill="#a3a3a3">over WebSocket</text>
  <path d="M486,152 A62,10 0 0 1 610,152 V218 A62,10 0 0 1 486,218 Z" fill="#ffffff" fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.25"/>
  <path d="M486,152 A62,10 0 0 0 610,152" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.25"/>
  <text x="548" y="184" text-anchor="middle" font-size="15" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" fill="#e6e6e6">data/</text>
  <text x="548" y="204" text-anchor="middle" font-size="13.5" fill="#a3a3a3">plain files</text>
  <path d="M548,95 V141" fill="none" stroke="#7d7d7d" stroke-width="1.5" marker-start="url(#tail)" marker-end="url(#head)"/>
</svg>
